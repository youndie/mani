services:
  mongo:
    image: mongo:8
    restart: always
    ports:
      - '27017:27017'
  mani:
    # JVM-образ: его собирает `./gradlew publishImageToLocalRegistry`. Нативный образ строится
    # отдельно — `docker build -f server-native/Dockerfile -t mani-native .`, см. README.
    image: mani-backend:latest
    ports:
      - '8080:8080'
    environment:
      MONGO_HOST: mongo
