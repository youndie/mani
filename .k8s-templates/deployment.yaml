apiVersion: apps/v1
kind: Deployment
metadata:
  name: mani-backend
  labels:
    app: mani-backend
  namespace: mani
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mani-backend
  template:
    metadata:
      labels:
        app: mani-backend
    spec:
      containers:
        - name: mani-backend
          image: ghcr.io/youndie/mani-kotlin-fullstack:0.2.$buildnumber
          ports:
            - name: http
              containerPort: 8080
          imagePullPolicy: Always
          # Под нативный бинарь: JVM здесь больше нет, а с ней ушли и heap, и метаспейс.
          # Значения выбраны с запасом от снятых на стенде — уточнить после первого выката.
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "1"
              memory: "128Mi"
          env:
            - name: MONGO_HOST
              value: mani-mongodb
            # Секрет подписи токенов. До этой правки переменная не задавалась вовсе, и сервер
            # подписывал значением по умолчанию — строкой "secret" из application.conf.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mani-backend
                  key: jwt-secret
      restartPolicy: Always
      imagePullSecrets:
        - name: regcred
