apiVersion: apps/v1
kind: Deployment
metadata:
  name: mani-backend
  labels:
    app: mani-backend
  namespace: mani
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mani-backend
  template:
    metadata:
      labels:
        app: mani-backend
    spec:
      containers:
        - name: mani-backend
          image: ghcr.io/youndie/mani-kotlin-fullstack:$version.$buildnumber
          ports:
            - name: http
              containerPort: 8080
          imagePullPolicy: Always

          # Жив ли процесс. НЕ трогает базу намеренно: проба живости, зависящая от базы,
          # превращает её падение в перезапуск всех подов — и лечит этим ровно ничего, только
          # добавляет холодных стартов к уже случившейся беде.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3

          # Есть ли с чем работать. Здесь база спрашивается: под, который её не видит, не должен
          # получать трафик. Без этой пробы k8s считал готовым любой запустившийся процесс, и
          # выкат с недоступной базой доезжал до конца зелёным.
          #
          # `initialDelaySeconds` не нужен: нативный бинарь отвечает через 87 мс после старта.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # Под нативный бинарь: JVM здесь больше нет, а с ней ушли и heap, и метаспейс.
          #
          # ПРЕДЕЛ ПОДНЯТ СО 128Mi ПОСЛЕ ЗАМЕРА ПОД НАГРУЗКОЙ. Прежнее число снималось в покое
          # («42 МиБ в покое, пик 45 МиБ»), и оно этим и было — числом в покое: у аллокатора
          # Kotlin/Native резидентная память идёт за числом потоков, а потоки заводит нагрузка.
          # Замер в покое по определению не мог увидеть то, ради чего предел и ставят.
          #
          # Релизный бинарь, 50 одновременных клиентов на `/health/ready` (каждый запрос — ping
          # в Mongo), два прогона на вариант:
          #
          #   по умолчанию            33 МБ в покое, пик 491–495 МБ
          #   fixedBlockPageSize=16   19 МБ в покое, пик 109–141 МБ
          #
          # То есть со 128Mi под убивало бы и так и так: без опции — кратно, с опцией — на пике.
          # 256Mi оставляет примерно двукратный запас над замеренным пиком.
          #
          # Замер честно уже по краю: `/health/ready` — самый дешёвый маршрут, у настоящих
          # запросов работы больше, а пятьдесят одновременных клиентов для одной реплики — это
          # всплеск, а не будни. Число выбрано по верхнему наблюдённому пику, а не по среднему.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          env:
            - name: MONGO_HOST
              value: mani-mongodb
            # Секрет подписи токенов. До этой правки переменная не задавалась вовсе, и сервер
            # подписывал значением по умолчанию — строкой "secret" из application.conf.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mani-backend
                  key: jwt-secret
      # Сколько у процесса есть после SIGTERM. Тридцать — умолчание Kubernetes, названное вслух.
      #
      # Названо, потому что с этой стороны оно ПРОВЕРЯЕТСЯ: `Main.kt` передаёт то же число в
      # `ShutdownDeadlines`, а kore отказывается стартовать, если сумма его сроков в него не
      # укладывается (5 с гашение готовности + 15 с слив + 3 x 3 с закрытие = 29 с). Пока число
      # стоит здесь молчаливым умолчанием, эта проверка идёт против предположения, и уменьшить
      # его правкой чарта можно было бы, не услышав ни слова.
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      imagePullSecrets:
        - name: regcred
