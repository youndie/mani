# Всё, кроме порта и точки входа, читается из переменных окружения — теми же именами, что и в
# нативной сборке (см. `ManiConfig.fromEnv`). Держать вторую копию тех же значений здесь значит
# однажды поправить одну из них.
ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ru.workinprogress.mani.ApplicationKt.module]
  }
}
