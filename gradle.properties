#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8G
#Gradle
org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#Ktor
io.ktor.development=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
kotlin.native.ignoreDisabledTargets=true

# Что читают общие соглашения (`ru.workinprogress.sborka`).
#
# Координата — та же, что у :server: группа, повторённая по модулям, это то, как шесть модулей
# соседнего репозитория уехали под группу, собранную из имени каталога.
sborka.group=ru.workinprogress.mani
sborka.repository=youndie/mani-kotlin-fullstack

# Одно число вместо `jvmToolchain(21)` в модулях и `JVM_21` в андроидных блоках.
sborka.jvmToolchain=21
sborka.jvmFloor=21

# PREFER_PROJECT — то, что здесь было и до соглашений: у `:composeApp` есть таргет wasmJs, а
# репозитории Node, Yarn и Binaryen объявляет сам Kotlin-плагин НА ПРОЕКТЕ. Более строгие режимы
# ломают его сообщением про ненайденный артефакт, а не про переопределённый репозиторий.
sborka.repositoriesMode=PREFER_PROJECT

# СВОЙ `.editorconfig`, и это решение, а не долг. Общий файл включает `ktlint_official`; здесь
# `intellij_idea`, отключено правило имени файла (файлы собраны по смыслу: `module.kt` — DI одной
# фичи, `sumOf.kt` — расширения над BigDecimal) и разрешены унаследованные звёздочные импорты —
# 80 штук в 35 файлах. Перевод на общий стиль переписал бы форматирование всего репозитория, и это
# правка кода, а не сборки: youndie/mani#142.
sborka.editorconfig=custom

