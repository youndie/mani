name: Test

on:
  pull_request:
    branches: [ "main" ]

jobs:
  # Стиль проверяется отдельной джобой: она короткая, и её падение сразу отличимо от падения
  # тестов. Правила лежат в .editorconfig, здесь только запуск.
  ktlint:
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check formatting
        run: ./gradlew ktlintCheck --no-daemon

  test-common:
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run tests
        run: ./gradlew :shared:jvmTest :server-common:jvmTest :server:test :composeApp:desktopTest :composeApp:wasmJsTest --no-daemon
      - name: Summarize tests results
        uses: mikepenz/action-junit-report@v5
        if: ${{ always() }}
        with:
          report_paths: |
            **/build/test-results/**/TEST-*.xml
            **/build/outputs/androidTest-results/**/TEST-*.xml

  # Нативная сборка проверяется отдельной джобой: ей нужен и C-драйвер, и настоящий mongod.
  # Без неё зелёный CI ничего не говорит об образе, который едет на стенд, — JVM-сборка
  # компилируется и проходит тесты даже когда нативная не линкуется вовсе.
  #
  # Раннер прибит к ubuntu-24.04, как и в deploy.yml: версия libmongoc обязана совпадать
  # с базой образа.
  test-native:
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install MongoDB C driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmongoc-dev libbson-dev
      # Релизный прогон обязателен, а не «дополнителен»: Kotlin/Native в релизе не вставляет
      # проверок приведения типов, и код, который в отладке падает ловимым исключением,
      # в релизе уходит в неопределённое поведение. Так `/auth/refresh` отдавал 500 на стенде
      # при зелёном CI — тестовый бинарь был отладочным, а в образе едет релизный.
      - name: Run native tests
        run: ./gradlew :server-common:linuxX64Test :server-native:linuxX64Test :server-native:linuxX64ReleaseTest --no-daemon
      - name: Summarize tests results
        uses: mikepenz/action-junit-report@v5
        if: ${{ always() }}
        with:
          report_paths: |
            **/build/test-results/**/TEST-*.xml

  test-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [ 24, 29 ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm  

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :androidApp:connectedAndroidTest

      - name: Summarize tests results
        uses: mikepenz/action-junit-report@v5
        if: ${{ always() }}
        with:
          report_paths: |
            **/build/test-results/**/TEST-*.xml
            **/build/outputs/androidTest-results/**/TEST-*.xml

  test-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run tests
        run: ./gradlew :composeApp:iosSimulatorArm64Test
