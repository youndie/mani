name: Build Desktop JAR

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      # Java и Gradle одним шагом и одной версией на весь портфель: действие ставит 21 и 25 и
      # оставляет 25 по умолчанию, а модули собираются на `sborka.jvmToolchain=21`, который Gradle
      # достаёт сам.
      - name: Setup Java and Gradle
        uses: youndie/sborka/.github/actions/setup-kotlin@main
      - name: Build
        run: ./gradlew :composeApp:packageUberJarForCurrentOS --no-daemon
      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: mani-desktop-${{ matrix.os }}
          retention-days: 1
          path: |
            composeApp/build/compose/jars/*.jar
