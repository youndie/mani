name: Deploy

# Выкат идёт ПОСЛЕ прогона тестов, а не параллельно с ним.
#
# Раньше `deploy` висел на `push` в `main`, а `Test` — только на `pull_request`: коммит, приехавший
# в `main`, разворачивался на стенд, ни разу не проверенный в том виде, в каком разворачивается.
# Теперь запуск цепляется за завершение `Test` на `main` и стартует только на зелёном.
#
# `workflow_dispatch` остаётся: ручной выкат нужен, когда чинят сам стенд.
on:
  workflow_run:
    workflows: [ "Test" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

# Раннер — ubuntu-24.04 явно, а не `ubuntu-latest`. Бинарь линкуется с системной libmongoc, и
# версия дистрибутива обязана совпадать с базой образа (см. server-native/Dockerfile). При
# `latest` эта пара разъедется молча в день, когда GitHub переведёт ярлык на следующий LTS.
jobs:
  build:
    runs-on: ubuntu-24.04
    # Ручной запуск идёт всегда; запуск по цепочке — только если `Test` завершился успехом.
    # Без этого условия красный прогон точно так же приводил бы к выкату, только позже.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # Тот самый коммит, который проверяли. `workflow_run` по умолчанию берёт голову ветки
          # по умолчанию, а не то, из-за чего запустился, — и выкатить можно было бы не то,
          # что проверено.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      - name: Setup Java and Gradle
        uses: youndie/sborka/.github/actions/setup-kotlin@main

      # Заголовки и .so-симлинки нужны линковке mongkn; в образ поедет только рантайм.
      - name: Install MongoDB C driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmongoc-dev libbson-dev

      - name: Build native server and frontend
        run: ./gradlew :server-native:linkReleaseExecutableLinuxX64 :composeApp:wasmJsBrowserDistribution --no-daemon

      # Версия читается из `gradle.properties` — того же места, откуда её берут сборки и откуда
      # она попадает в ответ `/health`. Иначе тег образа и ответ сервера, запущенного из этого
      # образа, называли бы разные числа, и по первому нельзя было бы найти второе.
      - name: Read the product version
        run: echo "MANI_VERSION=$(sed -n 's/^mani\.version=//p' gradle.properties)" >> "$GITHUB_ENV"

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOSTNAME }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server-native/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ vars.REGISTRY_HOSTNAME }}/mani-kotlin-fullstack:${{ env.MANI_VERSION }}.${{ github.run_number }}

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config

      - name: Apply deployment
        env:
          buildnumber: ${{ github.run_number }}
          version: ${{ env.MANI_VERSION }}
        run: |
          envsubst < .k8s-templates/deployment.yaml > .k8s/deployment.yaml
          kubectl apply -f .k8s/
