name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      # Java и Gradle одним шагом и одной версией на весь портфель: действие ставит 21 и 25 и
      # оставляет 25 по умолчанию — тот же 25, что у тулчейна соглашений; байткод держит
      # `sborka.jvmFloor=21`.
      - name: Setup Java and Gradle
        uses: youndie/sborka/.github/actions/setup-kotlin@main
      - name: Build
        run: ./gradlew :androidApp:assembleBenchmark --no-daemon
      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: mani-android
          retention-days: 1
          path: |
            androidApp/build/outputs/apk/**/*.apk
