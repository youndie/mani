name: docs

# No path filters. A filter saves seconds and buys a red default branch: the coverage map diverges
# from the files whenever something outside the listed paths moves, and a new directory is exactly
# what people forget to add to the list. Two dozen documents are checked in seconds.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # Monday morning, for the anchors job below
  workflow_dispatch:

jobs:
  # The gate. Exactly the target a person runs: a local check set that differs from the CI one turns
  # "green here, red there" into the normal state of affairs, and then neither is read.
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - run: make check

      # Default branch only. `status: draft` is legal in a pull request, where it means "this branch
      # will make it true", and becomes a defect the moment it merges.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 scripts/docs_check.py --on-main

  # Separate from the gate and on a schedule rather than on a pull request: an anchor rots because
  # of a rename in the code, and a red build the author did not cause teaches people to ignore
  # builds. It does not block either: a path quoted AS obsolete is indistinguishable from a live one
  # by machine. Add `--check` once the stale list reaches zero.
  anchors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      # The code lives in this same checkout, so its parent is a directory whose single subdirectory
      # is the repository — which is exactly what --repos expects.
      - run: python3 scripts/code_anchors.py --repos ..
